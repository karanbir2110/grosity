    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Dashboard - Grosity</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
            /* Dashboard specific styles */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                background: #f8f9fa;
                min-height: 100vh;
            }
            
            /* Header */
            .dashboard-header {
                background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
                color: white;
                padding: 20px 0;
                box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                position: sticky;
                top: 0;
                z-index: 100;
            }
            
            .header-content {
                max-width: 1400px;
                margin: 0 auto;
                padding: 0 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .logo {
                display: flex;
                align-items: center;
                gap: 15px;
            }
            
            .logo i {
                font-size: 32px;
            }
            
            .logo h1 {
                font-size: 24px;
                font-weight: 700;
            }
            
            .logo p {
                opacity: 0.9;
                font-size: 14px;
                margin-top: 5px;
            }
            
            .logout-btn {
                background: rgba(255, 255, 255, 0.2);
                color: white;
                padding: 12px 25px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 8px;
                cursor: pointer;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: all 0.3s;
            }
            
            .logout-btn:hover {
                background: rgba(255, 255, 255, 0.3);
                transform: translateY(-2px);
            }
            
            /* Main Container */
            .dashboard-container {
                max-width: 1400px;
                margin: 0 auto;
                padding: 30px 20px;
            }
            
            /* Stats Cards */
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 25px;
                margin-bottom: 40px;
            }
            
            .stat-card {
                background: white;
                padding: 25px;
                border-radius: 15px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.05);
                border-left: 5px solid #2e7d32;
                transition: transform 0.3s;
            }
            
            .stat-card:hover {
                transform: translateY(-5px);
            }
            
            .stat-card h3 {
                color: #6b7280;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-bottom: 15px;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            
            .stat-card .number {
                font-size: 42px;
                font-weight: 800;
                color: #1f2937;
                line-height: 1;
            }
            
            /* Products Table */
            .products-table-container {
                background: white;
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 4px 20px rgba(0,0,0,0.08);
                margin-bottom: 30px;
            }
            
            .table-header {
                padding: 25px;
                border-bottom: 1px solid #e5e7eb;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .table-header h2 {
                color: #1f2937;
                font-size: 20px;
                font-weight: 700;
            }
            
            .add-product-btn {
                background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
                color: white;
                padding: 12px 25px;
                border: none;
                border-radius: 10px;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 10px;
                transition: all 0.3s;
            }
            
            .add-product-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(46, 125, 50, 0.3);
            }
            
            table {
                width: 100%;
                border-collapse: collapse;
            }
            
            th {
                background: #f9fafb;
                padding: 18px 25px;
                text-align: left;
                color: #4b5563;
                font-weight: 600;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 1px;
                border-bottom: 2px solid #e5e7eb;
            }
            
            td {
                padding: 18px 25px;
                border-bottom: 1px solid #e5e7eb;
                color: #1f2937;
                font-size: 15px;
            }
            
            tr:hover {
                background: #f9fafb;
            }
            
            /* Action Buttons */
            .action-buttons {
                display: flex;
                gap: 10px;
            }
            
            .action-btn {
                padding: 8px 16px;
                border-radius: 8px;
                border: none;
                cursor: pointer;
                font-weight: 500;
                font-size: 14px;
                display: flex;
                align-items: center;
                gap: 6px;
                transition: all 0.3s;
            }
            
            .edit-btn {
                background: #dbeafe;
                color: #1d4ed8;
            }
            
            .edit-btn:hover {
                background: #bfdbfe;
            }
            
            .delete-btn {
                background: #fee2e2;
                color: #dc2626;
            }
            
            .delete-btn:hover {
                background: #fecaca;
            }
            
            /* Status Badges */
            .status-badge {
                padding: 6px 12px;
                border-radius: 20px;
                font-size: 12px;
                font-weight: 600;
                display: inline-block;
            }
            
            .in-stock {
                background: #d1fae5;
                color: #065f46;
            }
            
            .low-stock {
                background: #fef3c7;
                color: #92400e;
            }
            
            .out-of-stock {
                background: #fee2e2;
                color: #991b1b;
            }
            
            /* Loading & Error States */
            .loading-state {
                text-align: center;
                padding: 60px;
                color: #6b7280;
            }
            
            .loading-spinner {
                border: 4px solid #f3f3f3;
                border-top: 4px solid #2e7d32;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto 20px;
            }
            
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            
            .error-state {
                text-align: center;
                padding: 60px;
                color: #dc2626;
            }
            
            .error-state i {
                font-size: 48px;
                margin-bottom: 20px;
                opacity: 0.7;
            }
            
            .empty-state {
                text-align: center;
                padding: 80px;
                color: #6b7280;
            }
            
            .empty-state i {
                font-size: 64px;
                margin-bottom: 20px;
                opacity: 0.5;
            }
            
            /* Connection Test */
            .connection-test {
                background: white;
                padding: 25px;
                border-radius: 15px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.05);
                margin-top: 30px;
            }
            
            .connection-test h3 {
                color: #1f2937;
                margin-bottom: 15px;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            
            .test-btn {
                background: #4f46e5;
                color: white;
                padding: 12px 25px;
                border: none;
                border-radius: 10px;
                font-weight: 600;
                cursor: pointer;
                margin-right: 15px;
            }
            
            .result-box {
                margin-top: 20px;
                padding: 15px;
                border-radius: 10px;
                font-family: monospace;
                font-size: 14px;
                white-space: pre-wrap;
                word-break: break-all;
                max-height: 200px;
                overflow-y: auto;
            }
            
            .result-success {
                background: #d1fae5;
                color: #065f46;
                border: 1px solid #a7f3d0;
            }
            
            .result-error {
                background: #fee2e2;
                color: #991b1b;
                border: 1px solid #fecaca;
            }
            
            /* Modal Styles */
            .modal-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.5);
                z-index: 1000;
                justify-content: center;
                align-items: center;
            }
            
            .modal-content {
                background: white;
                padding: 30px;
                border-radius: 15px;
                width: 90%;
                max-width: 500px;
                max-height: 90vh;
                overflow-y: auto;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            }
            
            .modal-content h2 {
                color: #2e7d32;
                margin-bottom: 25px;
                padding-bottom: 15px;
                border-bottom: 2px solid #e5e7eb;
            }
            
            .modal-content label {
                display: block;
                margin-bottom: 8px;
                color: #4b5563;
                font-weight: 600;
            }
            
            .modal-content input,
            .modal-content textarea,
            .modal-content select {
                width: 100%;
                padding: 12px;
                border: 2px solid #e5e7eb;
                border-radius: 8px;
                font-size: 16px;
                margin-bottom: 20px;
                transition: border-color 0.3s;
            }
            
            .modal-content input:focus,
            .modal-content textarea:focus,
            .modal-content select:focus {
                outline: none;
                border-color: #2e7d32;
            }
            
            .modal-content textarea {
                min-height: 100px;
                resize: vertical;
            }
            
            .form-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            
            .checkbox-container {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 20px;
            }
            
            .checkbox-container input[type="checkbox"] {
                width: 20px;
                height: 20px;
            }
            
            .modal-buttons {
                display: flex;
                gap: 15px;
                justify-content: flex-end;
                margin-top: 30px;
                padding-top: 20px;
                border-top: 1px solid #e5e7eb;
            }
            
            .cancel-btn {
                padding: 12px 25px;
                background: #f5f5f5;
                border: none;
                border-radius: 8px;
                font-weight: 600;
                cursor: pointer;
                color: #4b5563;
            }
            
            .save-btn {
                padding: 12px 25px;
                background: #2e7d32;
                color: white;
                border: none;
                border-radius: 8px;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.3s;
            }
            
            .save-btn:hover {
                background: #1b5e20;
            }
            
            /* Responsive */
            @media (max-width: 768px) {
                .header-content {
                    flex-direction: column;
                    gap: 20px;
                    text-align: center;
                }
                
                .stats-grid {
                    grid-template-columns: 1fr;
                }
                
                .table-header {
                    flex-direction: column;
                    gap: 15px;
                }
                
                .action-buttons {
                    flex-direction: column;
                }
                
                table {
                    display: block;
                    overflow-x: auto;
                }
                
                .form-row {
                    grid-template-columns: 1fr;
                }
                
                .modal-content {
                    padding: 20px;
                    margin: 20px;
                }
            }
            
            /* Notification */
            .notification {
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 25px;
                border-radius: 10px;
                color: white;
                font-weight: 600;
                z-index: 1001;
                opacity: 0;
                transform: translateY(-20px);
                transition: all 0.3s;
                max-width: 400px;
            }
            
            .notification.show {
                opacity: 1;
                transform: translateY(0);
            }
            
            .notification.success {
                background: #10b981;
                border-left: 5px solid #059669;
            }
            
            .notification.error {
                background: #ef4444;
                border-left: 5px solid #dc2626;
            }
            
            .notification.warning {
                background: #f59e0b;
                border-left: 5px solid #d97706;
            }
        </style>
    </head>
    <body>
        <!-- Header -->
        <div class="dashboard-header">
            <div class="header-content">
                <div class="logo">
                    <div>
                        <h1><i class="fas fa-seedling"></i> Grosity Admin</h1>
                        <p>Manage Products, Stock, and Categories</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="dashboard-container">
            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3><i class="fas fa-shopping-basket"></i> Total Products</h3>
                    <div class="number" id="totalProducts">0</div>
                </div>
                <div class="stat-card">
                    <h3><i class="fas fa-box"></i> In Stock</h3>
                    <div class="number" id="inStock">0</div>
                </div>
                <div class="stat-card">
                    <h3><i class="fas fa-exclamation-triangle"></i> Out of Stock</h3>
                    <div class="number" id="outOfStock">0</div>
                </div>
                <div class="stat-card">
                    <h3><i class="fas fa-tags"></i> Categories</h3>
                    <div class="number" id="totalCategories">0</div>
                </div>
            </div>
            
            <!-- Products Table -->
            <div class="products-table-container">
                <div class="table-header">
                    <h2><i class="fas fa-list"></i> Products Management</h2>
                    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:15px;">

        <!-- Category Filter -->
        <select id="filterCategory">
            <option value="">All Categories</option>
            <option value="Fruits">Fruits</option>
            <option value="Vegetables">Vegetables</option>
        </select>

        <!-- Stock Filter -->
        <select id="filterStock">
            <option value="">All Stock</option>
            <option value="in">In Stock</option>
            <option value="low">Low Stock</option>
            <option value="out">Out of Stock</option>
        </select>

        <!-- Sort Filter -->
        <select id="sortBy">
            <option value="">Sort By</option>
            <option value="price-asc">Price ↑</option>
            <option value="price-desc">Price ↓</option>
            <option value="name-asc">Name A-Z</option>
            <option value="name-desc">Name Z-A</option>
        </select>

    </div>

                    <button class="add-product-btn" onclick="showAddProductModal()">
                        <i class="fas fa-plus"></i> Add New Product
                    </button>
                </div>
                
                <div id="tableContent">
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>Loading products from database...</p>
                    </div>
                </div>
            </div>
            
            <!-- Connection Test (Debug) -->
            <div class="connection-test">
                <h3><i class="fas fa-wrench"></i> Database Connection Test</h3>
                <button class="test-btn" onclick="testDatabaseConnection()">
                    <i class="fas fa-plug"></i> Test Connection
                </button>
                <button class="test-btn" style="background: #10b981;" onclick="loadProducts()">
                    <i class="fas fa-redo"></i> Reload Products
                </button>
                <div id="testResult" class="result-box"></div>
            </div>
        </div>
        
        <!-- Add/Edit Product Modal -->
        <div id="productModal" class="modal-overlay">
            <div class="modal-content">
                <h2 id="modalTitle">Add New Product</h2>
                
                <form id="productForm" onsubmit="handleProductForm(event)">
                    <input type="hidden" id="productId">
                    
                    <div>
                        <label for="productName">Product Name *</label>
                        <input type="text" id="productName" required>
                    </div>
                    
                    <div>
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" rows="3"></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div>
                            <label for="productPrice">Price (₹) *</label>
                            <input type="number" id="productPrice" step="0.01" min="0" required>
                        </div>
                        <div>
                            <label for="productDiscount">Discount %</label>
                            <input type="number" id="productDiscount" min="0" max="100" step="1">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div>
                            <label for="productStock">Stock Quantity *</label>
                            <input type="number" id="productStock" min="0" required>
                        </div>
                        <div>
                            <label for="productUnit">Unit (kg, pieces, etc.)</label>
                            <input type="text" id="productUnit" placeholder="e.g., kg, pcs, L">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div>
                            <label for="productCategory">Category *</label>
                                <select id="productCategory" required>
                                        <option value="">Select Category</option>
                                </select>

                        </div>
                        <div>
                            <label for="productImage">Image URL</label>
                            <input type="url" id="productImage" placeholder="https://example.com/image.jpg">
                        </div>
                    </div>
                    
                    <div class="checkbox-container">
                        <input type="checkbox" id="productOrganic">
                        <label for="productOrganic">Organic Product</label>
                    </div>
                    
                    <div class="modal-buttons">
                        <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="save-btn" id="modalSubmitBtn">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Notification -->
        <div id="notification" class="notification"></div>
        
        <!-- Load Supabase FIRST -->
        <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
        
        <!-- Then load your config -->
        <script src="config.js"></script>
        
        <!-- Main Dashboard JavaScript -->
        <script>
            // ====================
            // SUPABASE CONFIGURATION
            // ====================
            // Use the supabase client from config.js
            window.supabaseClient

            
            if (!window.supabaseClient) {
                console.error('❌ Supabase client not found! Check config.js');
                showNotification('Database connection error. Please refresh.', 'error');
            } else {
                console.log('✅ Supabase initialized from config.js');
            }
            
            // ====================
            // UTILITY FUNCTIONS
            // ====================
            
            // Check login status
            function checkLogin() {
                const isLoggedIn = sessionStorage.getItem('admin_logged_in') === 'true' ||
                                localStorage.getItem('admin_logged_in') === 'true';
                
                if (!isLoggedIn) {
                    showNotification('⚠️ Please login first!', 'warning');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                    return false;
                }
                return true;
            }
            
            // Logout function
            function logout() {
                sessionStorage.removeItem('admin_logged_in');
                localStorage.removeItem('admin_logged_in');
                window.location.href = 'index.html';
            }
            
            // Format currency
            function formatCurrency(amount) {
                return '₹' + parseFloat(amount).toFixed(2);
            }
            
            // Get stock status
            function getStockStatus(stock) {
                if (stock > 20) return '<span class="status-badge in-stock">In Stock</span>';
                if (stock > 0) return '<span class="status-badge low-stock">Low Stock</span>';
                return '<span class="status-badge out-of-stock">Out of Stock</span>';
            }
            
            // Show notification
            function showNotification(message, type = 'success') {
                const notification = document.getElementById('notification');
                notification.textContent = message;
                notification.className = `notification ${type} show`;
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
            
            // ====================
            // MODAL FUNCTIONS
            // ====================
            function showAddProductModal() {
                document.getElementById('modalTitle').textContent = 'Add New Product';
                document.getElementById('productForm').reset();
                document.getElementById('productId').value = '';
                document.getElementById('modalSubmitBtn').textContent = 'Add Product';
                document.getElementById('productModal').style.display = 'flex';
            }
            
            async function editProduct(productId) {
                try {
                    // Fetch product details
                    const { data: product, error } = await window.supabaseClient

                        .from('products')
                        .select('*')


                        .eq('id', productId)
                        .single();
                        
                    if (error) throw error;
                    
                    // Populate modal with product data
                    document.getElementById('modalTitle').textContent = 'Edit Product';
                    document.getElementById('productId').value = product.id;
                    document.getElementById('productName').value = product.name || '';
                    document.getElementById('productDescription').value = product.description || '';
                    document.getElementById('productPrice').value = product.price || '';
                    document.getElementById('productDiscount').value = product.discount_percentage || '';
                    document.getElementById('productStock').value = product.stock_quantity || '';
                    document.getElementById('productUnit').value = product.unit || '';
                    document.getElementById('productCategory').value = product.category_id || '';
                    document.getElementById('productImage').value = product.image_url || '';
                    document.getElementById('productOrganic').checked = product.is_organic || false;
                    document.getElementById('modalSubmitBtn').textContent = 'Update Product';
                    
                    document.getElementById('productModal').style.display = 'flex';
                    
                } catch (error) {
                    console.error('Error fetching product:', error);
                    showNotification('❌ Error: ' + error.message, 'error');
                }
            }
            
            function closeModal() {
                document.getElementById('productModal').style.display = 'none';
            }
            
            // ====================
            // CRUD OPERATIONS
            // ====================
            async function handleProductForm(event) {
                event.preventDefault();
                
                const productId = document.getElementById('productId').value;
                const productData = {
                    name: document.getElementById('productName').value,
                    description: document.getElementById('productDescription').value,
                    price: parseFloat(document.getElementById('productPrice').value),
                    discount_percentage: parseFloat(document.getElementById('productDiscount').value) || 0,
                    stock_quantity: parseInt(document.getElementById('productStock').value),
                    unit: document.getElementById('productUnit').value,
                    category_id: document.getElementById('productCategory').value || null,  
                    image_url: document.getElementById('productImage').value || null,
                    is_organic: document.getElementById('productOrganic').checked,
                    
                };
                
                if (productId) {
                    // Update existing product
                    await updateProduct(productId, productData);
                } else {
                    // Add new product
                    await addProduct(productData);
                }
                
                closeModal();
            }
            
            async function addProduct(productData) {
                try {
                    const { data, error } = await window.supabaseClient

                        .from('products')
                        .insert([productData])
                        .select();
                        
                    if (error) throw error;
                    
                    showNotification('✅ Product added successfully!', 'success');
                    loadProducts();
                    return data;
                } catch (error) {
                    console.error('Error adding product:', error);
                    showNotification('❌ Error adding product: ' + error.message, 'error');
                    return null;
                }
            }
            
            async function updateProduct(productId, updates) {
                try {
                    const { data, error } = await window.supabaseClient

                        .from('products')
                        .update(updates)
                        .eq('id', productId)
                        .select();
                        
                    if (error) throw error;
                    
                    showNotification('✅ Product updated successfully!', 'success');
                    loadProducts();
                    return data;
                } catch (error) {
                    console.error('Error updating product:', error);
                    showNotification('❌ Error updating product: ' + error.message, 'error');
                    return null;
                }
            }
            
            async function deleteProduct(productId) {
                if (!confirm('Are you sure you want to delete this product?\nThis action cannot be undone.')) {
                    return;
                }
                
                try {
                    const { error } = await window.supabaseClient

                        .from('products')
                        .delete()
                        .eq('id', productId);
                        
                    if (error) throw error;
                    
                    showNotification('✅ Product deleted successfully!', 'success');
                    loadProducts();
                } catch (error) {
                    console.error('Error deleting product:', error);
                    showNotification('❌ Error deleting product: ' + error.message, 'error');
                }
            }
            
            // ====================
            // DATABASE FUNCTIONS
            // ====================
            async function testDatabaseConnection() {
                const resultDiv = document.getElementById('testResult');
                resultDiv.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><p>Testing connection...</p></div>';
                
                try {
                    console.log('🔗 Testing Supabase connection...');
                    
                    // Test query
                    const { data, error } = await window.supabaseClient

                        .from('products')
                        .select('id, name, price')
                        .limit(2);
                    
                    if (error) {
                        console.error('❌ Connection failed:', error);
                        resultDiv.innerHTML = `
                            <div class="result-error">
                                <strong>❌ CONNECTION FAILED</strong><br><br>
                                <strong>Error:</strong> ${error.message}<br>
                                <strong>Code:</strong> ${error.code || 'N/A'}<br><br>
                                <strong>Possible fixes:</strong><br>
                                1. Check Supabase URL and Key<br>
                                2. Make sure you're using ANON key<br>
                                3. Check if RLS is disabled in Supabase<br>
                                4. Verify table name ('products') exists
                            </div>
                        `;
                        return false;
                    }
                    
                    console.log('✅ Connection successful!');
                    
                    resultDiv.innerHTML = `
                        <div class="result-success">
                            <strong>✅ CONNECTION SUCCESSFUL!</strong><br><br>
                            <strong>Found ${data.length} products:</strong><br>
                            ${data.map(p => `• ${p.name} (${formatCurrency(p.price)})`).join('<br>')}<br><br>
                            <strong>Connection details:</strong><br>
                            URL: ${SUPABASE_URL}<br>
                            Key: ${SUPABASE_KEY.substring(0, 30)}...
                        </div>
                    `;
                    
                    return true;
                    
                } catch (error) {
                    console.error('❌ Unexpected error:', error);
                    resultDiv.innerHTML = `
                        <div class="result-error">
                            <strong>❌ UNEXPECTED ERROR</strong><br><br>
                            ${error.message}<br><br>
                            <strong>Check these:</strong><br>
                            1. Check internet connection<br>
                            2. Verify Supabase credentials<br>
                            3. Check browser console (F12) for details
                        </div>
                    `;
                    return false;
                }
            }
            
            async function loadProducts() {
                if (!checkLogin()) return;
                
                const tableContent = document.getElementById('tableContent');
                tableContent.innerHTML = `
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>Loading products from database...</p>
                    </div>
                `;
                
                try {
                    console.log('🔄 Loading products...');
                    
                    // Load products
                    const { data: products, error } = await window.supabaseClient

                        .from('products')
                        .select('*')
                        .order('created_at', { ascending: false });
                    
                    if (error) {
                        console.error('❌ Error loading products:', error);
                        tableContent.innerHTML = `
                            <div class="error-state">
                                <i class="fas fa-exclamation-circle"></i>
                                <h3>Error loading products</h3>
                                <p>${error.message}</p>
                                <p style="margin-top: 20px;">
                                    <button class="test-btn" onclick="loadProducts()">Try Again</button>
                                    <button class="test-btn" onclick="testDatabaseConnection()">Test Connection</button>
                                </p>
                            </div>
                        `;
                        return;
                    }
                    
                    console.log(`✅ Loaded ${products.length} products`);
                    
                    window.allProducts = products; 

                    // Update statistics
                    updateStatistics(products);
                    
                    // Display products
                    displayProducts(products);
                    
                } catch (error) {
                    console.error('❌ Unexpected error:', error);
                    tableContent.innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>Unexpected error occurred</h3>
                            <p>${error.message}</p>
                            <p>Check browser console (F12) for details</p>
                        </div>
                    `;
                }
            }
            
            function updateStatistics(products) {
                const totalProducts = products.length;
                const inStock = products.filter(p => p.stock_quantity > 0).length;
                const outOfStock = products.filter(p => p.stock_quantity === 0).length;
                const categories = new Set(products.filter(p => p.category_id).map(p => p.category_id)).size;
                
                document.getElementById('totalProducts').textContent = totalProducts;
                document.getElementById('inStock').textContent = inStock;
                document.getElementById('outOfStock').textContent = outOfStock;
                document.getElementById('totalCategories').textContent = categories;
            }
            
            function displayProducts(products) {
                const tableContent = document.getElementById('tableContent');
                
                if (!products || products.length === 0) {
                    tableContent.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-shopping-basket"></i>
                            <h3>No products found</h3>
                            <p>Your database is empty. Click "Add New Product" to get started.</p>
                        </div>
                    `;
                    return;
                }
                
                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Unit</th>
                                <th>Status</th>
                                <th>Category</th>
                                <th>Organic</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                
                
                products.forEach(product => {
        const category = window.allCategories?.find(
            c => c.id === product.category_id
        );

        const hasDiscount = product.discount_percentage > 0;
        const discountedPrice = hasDiscount ?
            product.price * (1 - product.discount_percentage / 100) :
            product.price;

        tableHTML += `
            <tr>
                <td>
                    <strong>${product.name || 'No Name'}</strong>
                    ${product.description ? `<br><small style="color: #6b7280;">${product.description.substring(0, 50)}${product.description.length > 50 ? '...' : ''}</small>` : ''}
                </td>
                <td>
                    <strong>${formatCurrency(discountedPrice)}</strong>
                    ${hasDiscount ? `<br><small style="color: #dc2626; text-decoration: line-through;">${formatCurrency(product.price)}</small>` : ''}
                    ${hasDiscount ? `<br><small style="color: #059669;">${product.discount_percentage}% OFF</small>` : ''}
                </td>
                <td>${product.stock_quantity || 0}</td>
                <td>${product.unit || 'N/A'}</td>
                <td>${getStockStatus(product.stock_quantity)}</td>
                <td>${category?.name || 'Uncategorized'}</td>
                <td>${product.is_organic ? '✅ Yes' : '❌ No'}</td>
                <td>
                    <div class="action-buttons">
                        <button class="action-btn edit-btn" onclick="editProduct('${product.id}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="action-btn delete-btn" onclick="deleteProduct('${product.id}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </td>
            </tr>
        `;
    });
                
                tableHTML += `
                        </tbody>
                    </table>
                `;
                
                tableContent.innerHTML = tableHTML;
            }
            async function loadCategories() {
        const { data, error } = await window.supabaseClient
            .from('categories')
            .select('id, name')
            .order('name');

        if (error) {
            console.error('❌ Error loading categories:', error);
            return;
        }

        const select = document.getElementById('productCategory');
        select.innerHTML = '<option value="">Select Category</option>';

        data.forEach(category => {
            const option = document.createElement('option');
            option.value = category.id;   // UUID from database
            option.textContent = category.name;
            select.appendChild(option);
        });

        window.allCategories = data;

        
    }

            
            // ====================
            // INITIALIZATION
            // ====================
            document.addEventListener('DOMContentLoaded', function() {
                console.log('📄 Dashboard loaded');
                
                // Check if user is logged in
                if (!checkLogin()) return;
                
                // Load products automatically
                loadCategories();
                loadProducts();
                
                // Add keyboard shortcuts
                document.addEventListener('keydown', function(e) {
                    // Ctrl+R to reload products
                    if (e.ctrlKey && e.key === 'r') {
                        e.preventDefault();
                        loadProducts();
                    }
                    
                    // Esc to close modal or logout
                    if (e.key === 'Escape') {
                        if (document.getElementById('productModal').style.display === 'flex') {
                            closeModal();
                        } else if (confirm('Do you want to logout?')) {
                            logout();
                        }
                    }
                    
                    // Ctrl+N to add new product
                    if (e.ctrlKey && e.key === 'n') {
                        e.preventDefault();
                        showAddProductModal();
                    }
                });
                
                // Close modal when clicking outside
                document.getElementById('productModal').addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeModal();
                    }
                });
            });
            
            // Make functions available globally
            window.loadProducts = loadProducts;
            window.testDatabaseConnection = testDatabaseConnection;
            window.logout = logout;
            window.editProduct = editProduct;
            window.deleteProduct = deleteProduct;
            window.showAddProductModal = showAddProductModal;
            window.closeModal = closeModal;

            function applyFilters() {
        let filtered = [...window.allProducts];

        const category = document.getElementById('filterCategory').value;
        const stock = document.getElementById('filterStock').value;
        const sort = document.getElementById('sortBy').value;

        /* CATEGORY FILTER */
    /* CATEGORY FILTER */
    if (category) {
        const selectedCategory = window.allCategories.find(
            c => c.name.toLowerCase() === category.toLowerCase()
        );

        if (selectedCategory) {
            filtered = filtered.filter(
                p => p.category_id === selectedCategory.id
            );
        }
    }



        /* STOCK FILTER */
        if (stock === 'in') {
            filtered = filtered.filter(p => p.stock_quantity > 20);
        }
        if (stock === 'low') {
            filtered = filtered.filter(p => p.stock_quantity > 0 && p.stock_quantity <= 20);
        }
        if (stock === 'out') {
            filtered = filtered.filter(p => p.stock_quantity === 0);
        }

        /* SORTING */
        if (sort === 'price-asc') {
            filtered.sort((a, b) => a.price - b.price);
        }
        if (sort === 'price-desc') {
            filtered.sort((a, b) => b.price - a.price);
        }
        if (sort === 'name-asc') {
            filtered.sort((a, b) => a.name.localeCompare(b.name));
        }
        if (sort === 'name-desc') {
            filtered.sort((a, b) => b.name.localeCompare(a.name));
        }

        displayProducts(filtered);
    }

    document.getElementById('filterCategory').addEventListener('change', applyFilters);
    document.getElementById('filterStock').addEventListener('change', applyFilters);
    document.getElementById('sortBy').addEventListener('change', applyFilters);

        </script>
